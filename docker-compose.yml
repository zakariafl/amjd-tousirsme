name: amjd-tourisme

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${AMJD_DB_ROOT_PASSWORD:?Copy .env.example to .env}
      MYSQL_DATABASE: ${AMJD_DB_NAME:?Set AMJD_DB_NAME in .env}
      MYSQL_USER: ${AMJD_DB_USER:?Set AMJD_DB_USER in .env}
      MYSQL_PASSWORD: ${AMJD_DB_PASSWORD:?Set AMJD_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Initialization scripts run only when the Docker volume is EMPTY.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/04_auth.sql:/docker-entrypoint-initdb.d/03-auth.sql:ro
      - ./database/05_reservations.sql:/docker-entrypoint-initdb.d/04-reservations.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -u root --silent']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 25s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${AMJD_DB_NAME:?Set AMJD_DB_NAME in .env}
      DB_USER: ${AMJD_DB_USER:?Set AMJD_DB_USER in .env}
      DB_PASSWORD: ${AMJD_DB_PASSWORD:?Set AMJD_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules

volumes:
  mysql_data:
  frontend_node_modules:
